name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  minecraft-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -B package
        working-directory: minecraft-paper
      - uses: actions/upload-artifact@v4
        with:
          name: LinkHarbor-paper
          path: minecraft-paper/target/LinkHarbor-*.jar
      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: minecraft-paper/target/LinkHarbor-*.jar

  steam-a2s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r steam-a2s/requirements.txt
      - run: python -m py_compile steam-a2s/agent.py
      - run: python steam-a2s/agent.py --help > /dev/null
